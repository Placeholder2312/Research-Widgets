name: Android build and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Configure and validate required shared IPC keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RESEARCH_WIDGETS_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Required repository secret for $name is missing or unavailable."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/research-widgets-ipc.jks"
          if [ ! -s "$RUNNER_TEMP/research-widgets-ipc.jks" ]; then
            echo "::error::Shared IPC keystore decoded to an empty file."
            exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/research-widgets-ipc.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "RESEARCH_WIDGETS_KEYSTORE=$RUNNER_TEMP/research-widgets-ipc.jks" >> "$GITHUB_ENV"
          echo "Shared IPC keystore received, decoded, and validated."
          keytool -list -v -keystore "$RUNNER_TEMP/research-widgets-ipc.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | grep 'SHA256:'
      - name: Build and test
        env:
          RESEARCH_WIDGETS_KEYSTORE_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_PASSWORD }}
          RESEARCH_WIDGETS_KEY_ALIAS: ${{ secrets.RESEARCH_WIDGETS_KEY_ALIAS }}
          RESEARCH_WIDGETS_KEY_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Verify APK signature
        run: |
          set -euo pipefail
          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner -print | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: research-widgets-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
