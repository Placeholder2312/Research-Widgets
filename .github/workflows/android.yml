name: Android build and tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Configure required shared IPC keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Required repository secret RESEARCH_WIDGETS_KEYSTORE_BASE64 is missing or unavailable."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/research-widgets-ipc.jks"
          if [ ! -s "$RUNNER_TEMP/research-widgets-ipc.jks" ]; then
            echo "::error::The shared IPC keystore decoded to an empty file."
            exit 1
          fi
          echo "RESEARCH_WIDGETS_KEYSTORE=$RUNNER_TEMP/research-widgets-ipc.jks" >> "$GITHUB_ENV"
          echo "Shared IPC keystore received and decoded successfully."
      - name: Build and test
        env:
          RESEARCH_WIDGETS_KEYSTORE_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_PASSWORD }}
          RESEARCH_WIDGETS_KEY_ALIAS: ${{ secrets.RESEARCH_WIDGETS_KEY_ALIAS }}
          RESEARCH_WIDGETS_KEY_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: research-widgets-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
