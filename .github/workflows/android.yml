name: Android build and tests
on:
  push:
    branches: [feature/aftergleam-integration]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0'
      - name: Prepare optional shared IPC keystore
        if: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/research-widgets-ipc.jks"
          echo "RESEARCH_WIDGETS_KEYSTORE=$RUNNER_TEMP/research-widgets-ipc.jks" >> "$GITHUB_ENV"
      - name: Build and test
        env:
          RESEARCH_WIDGETS_KEYSTORE_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEYSTORE_PASSWORD }}
          RESEARCH_WIDGETS_KEY_ALIAS: ${{ secrets.RESEARCH_WIDGETS_KEY_ALIAS }}
          RESEARCH_WIDGETS_KEY_PASSWORD: ${{ secrets.RESEARCH_WIDGETS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: research-widgets-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
